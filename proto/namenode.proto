// Contrato gRPC del plano de control (sin bytes de archivo).
// - Servicio NameNode: DataNode -> NameNode (Register, Heartbeat, BlockReport, BlockReceived).
// - Servicio NameNodeHA: NameNode activo -> standby (ReplicateEditLog, Ping).
// El cliente NO usa este proto: habla REST con el NameNode.
syntax = "proto3";

package dfsha.namenode.v1;

option go_package = "dfsha/services/gen/namenode/v1;namenodev1";

import "datanode.proto";

service NameNode {
  // Called once when a DataNode starts. Returns the id the NameNode will use for it.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Every heartbeat_interval_seconds. The response carries pending commands.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // Full list of blocks on disk. On register and periodically.
  rpc BlockReport(BlockReportRequest) returns (BlockReportResponse);

  // Incremental: a block was stored (put pipeline or re-replication).
  rpc BlockReceived(BlockReceivedRequest) returns (BlockReceivedResponse);
}

service NameNodeHA {
  // Active ships every metadata mutation, in order, before acknowledging the client.
  rpc ReplicateEditLog(ReplicateEditLogRequest) returns (ReplicateEditLogResponse);

  // Liveness between NameNodes; standby promotes itself after N missed pings.
  rpc Ping(PingRequest) returns (PingResponse);
}

// ---------- DataNode -> NameNode ----------

message RegisterRequest {
  dfsha.datanode.v1.DataNodeEndpoint endpoint = 1;
  uint64 capacity_bytes = 2;
}

message RegisterResponse {
  string datanode_id = 1;
  uint32 heartbeat_interval_seconds = 2;
}

message HeartbeatRequest {
  string datanode_id = 1;
  uint64 capacity_bytes = 2;
  uint64 used_bytes = 3;
  uint32 active_transfers = 4;
}

message HeartbeatResponse {
  repeated Command commands = 1;
  // false = this NameNode does not know the DataNode; it must call Register again.
  bool registered = 2;
}

message Command {
  oneof action {
    ReplicateCommand replicate = 1;
    DeleteCommand delete = 2;
  }
}

// Copy block_id to targets using WriteBlock with targets as the pipeline.
message ReplicateCommand {
  string block_id = 1;
  repeated dfsha.datanode.v1.DataNodeEndpoint targets = 2;
}

message DeleteCommand {
  repeated string block_ids = 1;
}

message BlockInfo {
  string block_id = 1;
  uint64 size = 2;
  string checksum_sha256 = 3;
}

message BlockReportRequest {
  string datanode_id = 1;
  repeated BlockInfo blocks = 2;
}

message BlockReportResponse {
  // Blocks that belong to no file; the DataNode must delete them.
  repeated string orphan_block_ids = 1;
}

message BlockReceivedRequest {
  string datanode_id = 1;
  BlockInfo block = 2;
}

message BlockReceivedResponse {}

// ---------- NameNode active -> standby ----------

message EditLogEntry {
  // Strictly increasing; the standby rejects gaps.
  uint64 txid = 1;
  int64 timestamp_unix_ms = 2;
  oneof op {
    MkdirOp mkdir = 10;
    DeleteOp delete = 11;
    AllocateBlockOp allocate_block = 12;
    CommitBlockOp commit_block = 13;
    FinalizeFileOp finalize_file = 14;
  }
}

message MkdirOp {
  string path = 1;
  string owner = 2;
}

message DeleteOp {
  string path = 1;
  bool recursive = 2;
}

message AllocateBlockOp {
  string path = 1;
  uint32 block_index = 2;
  string block_id = 3;
  repeated string datanode_ids = 4;
}

message CommitBlockOp {
  string path = 1;
  string block_id = 2;
  uint64 size = 3;
  string checksum_sha256 = 4;
}

message FinalizeFileOp {
  string path = 1;
  uint64 total_size = 2;
}

message ReplicateEditLogRequest {
  repeated EditLogEntry entries = 1;
}

message ReplicateEditLogResponse {
  uint64 last_applied_txid = 1;
}

message PingRequest {
  string node_id = 1;
  uint64 last_txid = 2;
}

message PingResponse {
  string node_id = 1;
  bool is_active = 2;
  uint64 last_txid = 3;
}